<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10263f"><link rel="stylesheet" href="/theme.css"><title>Sign in | Lite Shipping DCR Monitor</title></head><body><main class="login-wrap"><section class="login-card"><div class="brand-mark">LS</div><p class="eyebrow">LITE SHIPPING CORPORATION</p><h1>Staff sign in</h1><p class="muted">Enter your approved staff email. We'll send a one-time sign-in code.</p><form id="f"><label>Email address<input id="email" type="email" required autocomplete="username webauthn"></label><label id="codeRow" hidden>6-digit code<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><button class="primary" id="go">Continue</button></form><p id="msg" class="hint" aria-live="polite"></p></section></main><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const A=window.hatchable.auth,email=document.getElementById('email').value.trim(),row=document.getElementById('codeRow'),msg=document.getElementById('msg'),go=document.getElementById('go');go.disabled=true;try{if(row.hidden){await A.startLogin({email});row.hidden=false;go.textContent='Sign in';msg.textContent='Check your email for the one-time code.';}else{await A.verifyCode({email,code:document.getElementById('code').value.trim()});location.replace('/');}}catch(err){msg.textContent=err.message||'Sign-in failed.';}finally{go.disabled=false;}});window.hatchable.auth.getSession().then(s=>{if(s&&s.user)location.replace('/');});</script></body></html>
